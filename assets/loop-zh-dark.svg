<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="920" viewBox="0 0 1760 920" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">Agent GenOps 流程</title>
  <desc id="desc">Agent GenOps 流程：九步依次是受理、盘点、计划、探测、smoke、运行、验收、记录、清理。清理之后沿回路回到受理。</desc>
  <style>
    .bg{fill:#0D1117}
    .ink{fill:#E6EDF3}
    .mut{fill:#8B949E}
    .acc{fill:#FF8A3D}
    .acct{fill:#FF8A3D}
    .teal{fill:#2DD4BF}
    .tacc{fill:#2A1B10}
    .tteal{fill:#0E2724}
    .ln{stroke:#30363D}
    .sacc{stroke:#FF8A3D}
    .steal{stroke:#2DD4BF}
    .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace}
    .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', 'PingFang SC', 'Microsoft YaHei', serif}
  </style>
  <rect class="bg ln" x="1" y="1" width="1758" height="918" rx="24" stroke-width="2"/>
  <defs>
    <marker id="ha" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path class="acc" d="M0,2 L16,8 L0,14 Z"/>
    </marker>
    <marker id="ht" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path class="teal" d="M0,2 L16,8 L0,14 Z"/>
    </marker>
  </defs>
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <line class="sacc" x1="548" y1="248" x2="612" y2="248" marker-end="url(#ha)"/>
    <line class="sacc" x1="1068" y1="248" x2="1132" y2="248" marker-end="url(#ha)"/>
    <path class="sacc" d="M1360,340 V380 H320 V420" marker-end="url(#ha)"/>
    <line class="sacc" x1="548" y1="512" x2="612" y2="512" marker-end="url(#ha)"/>
    <line class="sacc" x1="1068" y1="512" x2="1132" y2="512" marker-end="url(#ha)"/>
    <path class="sacc" d="M1360,604 V644 H320 V684" marker-end="url(#ha)"/>
    <line class="sacc" x1="548" y1="776" x2="612" y2="776" marker-end="url(#ha)"/>
    <line class="sacc" x1="1068" y1="776" x2="1132" y2="776" marker-end="url(#ha)"/>
    <path class="steal" d="M1588,776 H1664 V96 H320 V156" marker-end="url(#ht)"/>
  </g>
  <text class="sans teal" x="1640" y="76" font-size="31" text-anchor="end">回到受理</text>
  <rect class="bg ln" x="96" y="160" width="448" height="176" rx="16" stroke-width="2"/>
  <text class="mono acct" x="132" y="236" font-size="31">01</text>
  <text class="serif ink" x="196" y="236" font-size="44">受理</text>
  <text class="sans mut" x="196" y="290" font-size="31">这一步要证明什么</text>
  <rect class="bg ln" x="616" y="160" width="448" height="176" rx="16" stroke-width="2"/>
  <text class="mono acct" x="652" y="236" font-size="31">02</text>
  <text class="serif ink" x="716" y="236" font-size="44">盘点</text>
  <text class="sans mut" x="716" y="290" font-size="31">已经有什么</text>
  <rect class="bg ln" x="1136" y="160" width="448" height="176" rx="16" stroke-width="2"/>
  <text class="mono acct" x="1172" y="236" font-size="31">03</text>
  <text class="serif ink" x="1236" y="236" font-size="44">计划</text>
  <text class="sans mut" x="1236" y="290" font-size="31">先打印，不执行</text>
  <rect class="bg ln" x="96" y="424" width="448" height="176" rx="16" stroke-width="2"/>
  <text class="mono acct" x="132" y="500" font-size="31">04</text>
  <text class="serif ink" x="196" y="500" font-size="44">探测</text>
  <text class="sans mut" x="196" y="554" font-size="31">不空闲就 HOLD</text>
  <rect class="bg ln" x="616" y="424" width="448" height="176" rx="16" stroke-width="2"/>
  <text class="mono acct" x="652" y="500" font-size="31">05</text>
  <text class="serif ink" x="716" y="500" font-size="44">smoke</text>
  <text class="sans mut" x="716" y="554" font-size="31">只出一张</text>
  <rect class="bg ln" x="1136" y="424" width="448" height="176" rx="16" stroke-width="2"/>
  <text class="mono acct" x="1172" y="500" font-size="31">06</text>
  <text class="serif ink" x="1236" y="500" font-size="44">运行</text>
  <text class="sans mut" x="1236" y="554" font-size="31">产物单独存放</text>
  <rect class="bg ln" x="96" y="688" width="448" height="176" rx="16" stroke-width="2"/>
  <text class="mono acct" x="132" y="764" font-size="31">07</text>
  <text class="serif ink" x="196" y="764" font-size="44">验收</text>
  <text class="sans mut" x="196" y="818" font-size="31">打开产物看</text>
  <rect class="bg ln" x="616" y="688" width="448" height="176" rx="16" stroke-width="2"/>
  <text class="mono acct" x="652" y="764" font-size="31">08</text>
  <text class="serif ink" x="716" y="764" font-size="44">记录</text>
  <text class="sans mut" x="716" y="818" font-size="31">记账、写记忆</text>
  <rect class="bg ln" x="1136" y="688" width="448" height="176" rx="16" stroke-width="2"/>
  <text class="mono acct" x="1172" y="764" font-size="31">09</text>
  <text class="serif ink" x="1236" y="764" font-size="44">清理</text>
  <text class="sans mut" x="1236" y="818" font-size="31">删掉测试图</text>
</svg>
