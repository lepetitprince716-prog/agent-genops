  <text class="serif acc" x="100" y="566" font-size="264" letter-spacing="-4" font-style="italic">GenOps</text>
  <rect class="acc" x="96" y="683" width="96" height="10"/>
  <line class="ln" x1="224" y1="688" x2="984" y2="688" stroke-width="4"/>
  <polygon class="acc" points="1000,682 1084,682 1104,666 1020,666"/>
  <polygon class="teal" points="1000,710 1084,710 1104,694 1020,694"/>
