<svg xmlns="http://www.w3.org/2000/svg" width="686" height="1644" viewBox="0 0 686 1644" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">Agent GenOps 架构</title>
  <desc id="desc">Agent GenOps 架构分三层。控制面在控制机上：主会话、subagent、外部 worker、skill、MCP 服务、任务库、记忆与 STATE、hook 与闸门。薄入口层：意图路由、JSON 任务单、MCP 工具组、浏览器面板操作员。执行面：Box A、Box B、旁路实例、云服务。命令向下，结果向上。</desc>
  <style>
    .bg{fill:#FAFAF7}
    .ink{fill:#1F2328}
    .mut{fill:#57606A}
    .acc{fill:#E8590C}
    .acct{fill:#C2410C}
    .teal{fill:#0F766E}
    .tacc{fill:#FFF1E6}
    .tteal{fill:#E7F5F2}
    .ln{stroke:#D0D7DE}
    .sacc{stroke:#E8590C}
    .steal{stroke:#0F766E}
    .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace}
    .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', 'PingFang SC', 'Microsoft YaHei', serif}
  </style>
  <rect class="bg ln" x="1" y="1" width="684" height="1642" rx="24" stroke-width="2"/>
  <defs>
    <marker id="ha" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path class="acc" d="M0,2 L16,8 L0,14 Z"/>
    </marker>
    <marker id="ht" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path class="teal" d="M0,2 L16,8 L0,14 Z"/>
    </marker>
  </defs>
  <rect class="tacc sacc" x="32" y="32" width="622" height="732" rx="20" stroke-width="2"/>
  <text class="serif ink" x="60" y="104" font-size="46">控制面</text>
  <text class="sans mut" x="60" y="150" font-size="31">在控制机上</text>
  <rect class="bg sacc" x="60" y="180" width="566" height="96" rx="16" stroke-width="3"/>
  <text class="sans ink" x="343" y="240.24" font-size="34" text-anchor="middle" font-weight="700">主会话</text>
  <rect class="bg ln" x="108" y="304" width="518" height="80" rx="16" stroke-width="2"/>
  <text class="sans ink" x="367" y="356.24" font-size="34" text-anchor="middle" font-weight="700">subagent</text>
  <rect class="bg ln" x="108" y="404" width="518" height="80" rx="16" stroke-width="2"/>
  <text class="sans ink" x="367" y="456.24" font-size="34" text-anchor="middle" font-weight="700">外部 worker</text>
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <path class="sacc" d="M84,278 V344 H104" marker-end="url(#ha)"/>
    <path class="sacc" d="M84,344 V444 H104" marker-end="url(#ha)"/>
  </g>
  <rect class="acc" x="60" y="533" width="8" height="8"/>
  <text class="mono mut" x="88" y="548" font-size="31">skill</text>
  <rect class="acc" x="60" y="579" width="8" height="8"/>
  <text class="sans mut" x="88" y="594" font-size="31">MCP 服务</text>
  <rect class="acc" x="60" y="625" width="8" height="8"/>
  <text class="sans mut" x="88" y="640" font-size="31">任务库</text>
  <rect class="acc" x="60" y="671" width="8" height="8"/>
  <text class="sans mut" x="88" y="686" font-size="31">记忆 + STATE</text>
  <rect class="acc" x="60" y="717" width="8" height="8"/>
  <text class="sans mut" x="88" y="732" font-size="31">hook + 闸门</text>
  <g fill="none" stroke-width="3">
    <line class="sacc" x1="313" y1="768" x2="313" y2="856" marker-end="url(#ha)"/>
    <line class="steal" x1="373" y1="856" x2="373" y2="768" marker-end="url(#ht)"/>
  </g>
  <text class="sans acct" x="289" y="822" font-size="31" text-anchor="end">命令</text>
  <text class="sans teal" x="397" y="822" font-size="31">结果</text>
  <rect class="bg ln" x="32" y="860" width="622" height="308" rx="20" stroke-width="2"/>
  <text class="serif ink" x="60" y="932" font-size="46">薄入口层</text>
  <rect class="mut" x="60" y="979" width="8" height="8"/>
  <text class="sans mut" x="88" y="994" font-size="31">意图路由</text>
  <rect class="mut" x="60" y="1025" width="8" height="8"/>
  <text class="sans mut" x="88" y="1040" font-size="31">JSON 任务单</text>
  <rect class="mut" x="60" y="1071" width="8" height="8"/>
  <text class="sans mut" x="88" y="1086" font-size="31">MCP 工具组</text>
  <rect class="mut" x="60" y="1117" width="8" height="8"/>
  <text class="sans mut" x="88" y="1132" font-size="31">浏览器面板操作员</text>
  <g fill="none" stroke-width="3">
    <line class="sacc" x1="313" y1="1172" x2="313" y2="1260" marker-end="url(#ha)"/>
    <line class="steal" x1="373" y1="1260" x2="373" y2="1172" marker-end="url(#ht)"/>
  </g>
  <rect class="tteal steal" x="32" y="1264" width="622" height="348" rx="20" stroke-width="2"/>
  <text class="serif ink" x="60" y="1336" font-size="46">执行面</text>
  <rect class="bg ln" x="60" y="1376" width="271" height="88" rx="16" stroke-width="2"/>
  <text class="sans ink" x="195.5" y="1432.24" font-size="34" text-anchor="middle" font-weight="700">Box A</text>
  <rect class="bg ln" x="355" y="1376" width="271" height="88" rx="16" stroke-width="2"/>
  <text class="sans ink" x="490.5" y="1432.24" font-size="34" text-anchor="middle" font-weight="700">Box B</text>
  <rect class="bg steal" x="60" y="1484" width="271" height="88" rx="16" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="sans ink" x="195.5" y="1540.24" font-size="34" text-anchor="middle" font-weight="700">旁路实例</text>
  <rect class="bg ln" x="355" y="1484" width="271" height="88" rx="16" stroke-width="2"/>
  <text class="sans ink" x="490.5" y="1540.24" font-size="34" text-anchor="middle" font-weight="700">云服务</text>
</svg>
