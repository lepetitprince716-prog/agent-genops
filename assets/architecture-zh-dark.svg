<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1120" viewBox="0 0 1760 1120" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">Agent GenOps 架构</title>
  <desc id="desc">Agent GenOps 架构分三层。控制面在控制机上：主会话、subagent、外部 worker、skill、MCP 服务、任务库、记忆与 STATE、hook 与闸门。薄入口层：意图路由、JSON 任务单、MCP 工具组、浏览器面板操作员。执行面：Box A、Box B、旁路实例、云服务。命令向下，结果向上。</desc>
  <style>
    .bg{fill:#0D1117}
    .ink{fill:#E6EDF3}
    .mut{fill:#8B949E}
    .acc{fill:#FF8A3D}
    .acct{fill:#FF8A3D}
    .teal{fill:#2DD4BF}
    .tacc{fill:#2A1B10}
    .tteal{fill:#0E2724}
    .ln{stroke:#30363D}
    .sacc{stroke:#FF8A3D}
    .steal{stroke:#2DD4BF}
    .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace}
    .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', 'PingFang SC', 'Microsoft YaHei', serif}
  </style>
  <rect class="bg ln" x="1" y="1" width="1758" height="1118" rx="24" stroke-width="2"/>
  <defs>
    <marker id="ha" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path class="acc" d="M0,2 L16,8 L0,14 Z"/>
    </marker>
    <marker id="ht" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path class="teal" d="M0,2 L16,8 L0,14 Z"/>
    </marker>
  </defs>
  <rect class="tacc sacc" x="96" y="64" width="1568" height="328" rx="20" stroke-width="2"/>
  <text class="serif ink" x="144" y="144" font-size="48">控制面</text>
  <text class="sans mut" x="1616" y="144" font-size="31" text-anchor="end">在控制机上</text>
  <rect class="bg ln" x="144" y="184" width="432" height="112" rx="16" stroke-width="2"/>
  <text class="sans ink" x="360" y="252.96" font-size="36" text-anchor="middle" font-weight="700">subagent</text>
  <rect class="bg sacc" x="624" y="184" width="512" height="112" rx="16" stroke-width="3"/>
  <text class="sans ink" x="880" y="252.96" font-size="36" text-anchor="middle" font-weight="700">主会话</text>
  <rect class="bg ln" x="1184" y="184" width="432" height="112" rx="16" stroke-width="2"/>
  <text class="sans ink" x="1400" y="252.96" font-size="36" text-anchor="middle" font-weight="700">外部 worker</text>
  <g fill="none" stroke-width="3">
    <line class="sacc" x1="622" y1="240" x2="578" y2="240" marker-end="url(#ha)"/>
    <line class="sacc" x1="1138" y1="240" x2="1182" y2="240" marker-end="url(#ha)"/>
  </g>
  <text class="sans mut" x="880" y="352" font-size="31" text-anchor="middle" xml:space="preserve">skill  ·  MCP 服务  ·  任务库  ·  记忆 + STATE  ·  hook + 闸门</text>
  <g fill="none" stroke-width="3">
    <line class="sacc" x1="848" y1="396" x2="848" y2="500" marker-end="url(#ha)"/>
    <line class="steal" x1="912" y1="500" x2="912" y2="396" marker-end="url(#ht)"/>
  </g>
  <text class="sans acct" x="824" y="459" font-size="31" text-anchor="end">命令</text>
  <text class="sans teal" x="936" y="459" font-size="31">结果</text>
  <rect class="bg ln" x="96" y="504" width="1568" height="176" rx="20" stroke-width="2"/>
  <text class="serif ink" x="144" y="580" font-size="48">薄入口层</text>
  <text class="sans mut" x="144" y="640" font-size="31" xml:space="preserve">意图路由  ·  JSON 任务单  ·  MCP 工具组  ·  浏览器面板操作员</text>
  <g fill="none" stroke-width="3">
    <line class="sacc" x1="848" y1="684" x2="848" y2="788" marker-end="url(#ha)"/>
    <line class="steal" x1="912" y1="788" x2="912" y2="684" marker-end="url(#ht)"/>
  </g>
  <rect class="tteal steal" x="96" y="792" width="1568" height="264" rx="20" stroke-width="2"/>
  <text class="serif ink" x="144" y="868" font-size="48">执行面</text>
  <rect class="bg ln" x="144" y="908" width="332" height="104" rx="16" stroke-width="2"/>
  <text class="sans ink" x="310" y="972.96" font-size="36" text-anchor="middle" font-weight="700">Box A</text>
  <rect class="bg ln" x="524" y="908" width="332" height="104" rx="16" stroke-width="2"/>
  <text class="sans ink" x="690" y="972.96" font-size="36" text-anchor="middle" font-weight="700">Box B</text>
  <rect class="bg steal" x="904" y="908" width="332" height="104" rx="16" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="sans ink" x="1070" y="972.96" font-size="36" text-anchor="middle" font-weight="700">旁路实例</text>
  <rect class="bg ln" x="1284" y="908" width="332" height="104" rx="16" stroke-width="2"/>
  <text class="sans ink" x="1450" y="972.96" font-size="36" text-anchor="middle" font-weight="700">云服务</text>
</svg>
