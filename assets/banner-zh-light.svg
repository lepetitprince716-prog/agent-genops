  <rect class="bg ln" x="1" y="1" width="1758" height="558" rx="24" stroke-width="2"/>
  <text class="serif ink" x="132" y="280" font-size="208" letter-spacing="-3">Agent <tspan class="acc" font-style="italic">GenOps</tspan></text>
  <rect class="acc" x="128" y="417" width="72" height="6"/>
  <text class="sans mut" x="224" y="429" font-size="30" letter-spacing="1">以 agent 为中心的实战笔记</text>
  <line class="ln" x1="704" y1="420" x2="1520" y2="420" stroke-width="2"/>
  <polygon class="acc" points="1552,416 1620,416 1632,406 1564,406"/>
  <polygon class="teal" points="1552,434 1620,434 1632,424 1564,424"/>
