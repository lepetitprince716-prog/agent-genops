<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="560" viewBox="0 0 1760 560" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">Agent GenOps</title>
  <desc id="desc">Agent GenOps：以 agent 平台为中心的本地生成模型调试、部署与出图方法。</desc>
  <style>
    .bg{fill:#FAFAF7}
    .ink{fill:#1F2328}
    .mut{fill:#57606A}
    .acc{fill:#E8590C}
