name: artfetch

on:
  push:
    branches: [main]
    paths:
      - "artfetch/**"
      - ".github/workflows/artfetch.yml"
  pull_request:
    paths:
      - "artfetch/**"
      - ".github/workflows/artfetch.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: artfetch

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships rustup; this avoids third-party setup actions.
      # The toolchain is pinned so a new Rust release cannot change the result.
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --locked --all-targets
