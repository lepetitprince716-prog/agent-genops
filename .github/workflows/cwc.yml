name: cwc

# Tests, lint and a package smoke test for the cwc/ subproject. The privacy and secret
# scans of the whole repository live in privacy.yml.
on:
  push:
    branches: [main]
    paths:
      - "cwc/**"
      - ".github/workflows/cwc.yml"
  pull_request:
    paths:
      - "cwc/**"
      - ".github/workflows/cwc.yml"

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. Runs on main are
# never cancelled: every commit there gets a finished result.
concurrency:
  group: cwc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: cwc

jobs:
  tests:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.14"] # the two ends of the supported range
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.15.16
      - name: Ruff
        run: ruff check src tests tools
      - name: No node type names in src/cwc
        run: python -B tools/lint_no_node_names.py

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The build tool is installed at an exact version and used without build isolation, so the
      # wheel is not built with whatever "setuptools>=68" resolves to on the day. The package has no
      # runtime dependencies. Installs are not hash-checked: no lock file is kept.
      - name: Install the build tool
        run: python -m pip install setuptools==82.0.1
      - name: Build the wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheel" .
      - name: Install it into a fresh environment outside the checkout
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Compile a minimal graph with the installed command
        run: |
          set -euo pipefail
          # The graph comes from the checkout, the command from the wheel: the
          # checkout's src/ is on the path only for the one line that writes the graph.
          PYTHONPATH=src:. python -B -c "import json; from tests.graphs import txt2img; print(json.dumps(txt2img()))" > "$RUNNER_TEMP/txt2img.json"
          cd "$RUNNER_TEMP"
          venv/bin/cwc --help
          venv/bin/cwc compile txt2img.json -o compiled
          test -s compiled/txt2img.ui.json
          test -s compiled/txt2img.api.json
